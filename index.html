<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STARSHIP 011179 | 宇宙航行终端</title>
    <style>
        :root {
            --primary: #5c6af4;
            --accent: #b95cf4;
            --glass: rgba(16, 18, 27, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text: #ffffff;
            --text-dim: #cccccc;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: var(--text);
            background: #000;
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
        }

        #star-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -10;
        }

        .ui-layer {
            position: fixed;
            bottom: 0; left: 0;
            width: 80vw; height: 80vh;
            z-index: -5;
            opacity: 0.25;
            background-image: url('ui.jpg');
            background-repeat: no-repeat;
            background-position: bottom left;
            background-size: contain;
            pointer-events: none;
            -webkit-mask-image: linear-gradient(to right, black 60%, transparent 90%);
            mask-image: linear-gradient(to right, black 60%, transparent 90%);
            mix-blend-mode: screen;
        }

        .viewport-container {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 90vw; height: 90vh;
            max-width: 1400px; max-height: 800px;
            z-index: -2;
            background-image: url('bg.jpg');
            background-size: cover;
            background-position: center;
            border-radius: 20px;
            border: 1px solid rgba(92, 106, 244, 0.4);
            box-shadow: 0 0 50px rgba(92, 106, 244, 0.15), inset 0 0 100px rgba(0,0,0,0.9);
            overflow: hidden;
            opacity: 0.9;
        }

        .viewport-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10, 14, 30, 0.4);
            background-image: linear-gradient(rgba(0,0,0,0) 50%, rgba(0,0,0,0.2) 50%);
            background-size: 100% 4px;
            pointer-events: none;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
            position: relative;
            z-index: 10;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
            background: rgba(16, 18, 27, 0.6);
            backdrop-filter: blur(8px);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            animation: float 8s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        h1 {
            margin: 0;
            font-size: 2.8rem;
            font-weight: 700;
            background: linear-gradient(to right, #fff, var(--primary), #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(92, 106, 244, 0.6);
            font-family: 'Times New Roman', serif;
            letter-spacing: 2px;
        }

        .subtitle {
            margin-top: 15px;
            color: var(--primary);
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 6px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(92, 106, 244, 0.4);
        }

        .search-box {
            width: 100%;
            padding: 18px 30px;
            font-size: 1.1rem;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--primary);
            border-radius: 50px;
            color: white;
            backdrop-filter: blur(10px);
            transition: 0.3s;
            box-shadow: 0 0 15px rgba(92, 106, 244, 0.2);
            margin-bottom: 40px;
        }
        .search-box:focus {
            outline: none;
            background: rgba(0, 0, 0, 0.8);
            box-shadow: 0 0 30px rgba(92, 106, 244, 0.5);
            border-color: #fff;
        }

        .tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-bottom: 40px;
        }

        .tab-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: var(--text-dim);
            padding: 10px 24px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s;
            backdrop-filter: blur(5px);
            font-size: 0.95rem;
        }

        .tab-btn:hover, .tab-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 0 20px var(--primary);
            transform: scale(1.05);
        }

        .song-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .song-card {
            background: var(--glass);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            padding: 20px;
            border-radius: 16px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .song-card::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, transparent 0%, rgba(255,255,255,0.05) 100%);
            opacity: 0;
            transition: 0.3s;
        }

        .song-card:hover {
            transform: translateY(-8px);
            border-color: var(--primary);
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
        }
        .song-card:hover::after { opacity: 1; }

        .song-title {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-artist {
            font-size: 0.85rem;
            color: var(--text-dim);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tag {
            font-size: 0.7rem;
            padding: 4px 8px;
            background: rgba(92, 106, 244, 0.2);
            color: #aeb4ff;
            border-radius: 6px;
        }

        .click-star {
            position: absolute;
            width: 40px; height: 40px;
            background: radial-gradient(circle, #fff 0%, transparent 70%);
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            animation: burst 0.8s ease-out forwards;
            pointer-events: none;
            z-index: 9999;
        }
        @keyframes burst {
            0% { transform: scale(0) rotate(0deg); opacity: 1; }
            100% { transform: scale(1.5) rotate(180deg); opacity: 0; }
        }

        .stats {
            text-align: center;
            margin-top: 60px;
            color: rgba(255,255,255,0.3);
            font-size: 0.8rem;
            letter-spacing: 2px;
        }

        @media (max-width: 768px) {
            .viewport-container {
                width: 90%; height: 65vh;
                top: auto; bottom: -20px; left: 0;
                transform: none;
                background-position: left bottom;
                background-size: cover;
                background-repeat: no-repeat;
                -webkit-mask-image: linear-gradient(to top right, black 40%, transparent 90%);
                mask-image: linear-gradient(to top right, black 40%, transparent 90%);
                border: none; box-shadow: none; border-radius: 0; opacity: 0.8;
            }
            .ui-layer { display: none; }
            header {
                padding: 20px 10px; margin-bottom: 20px;
                animation: none;
                background: rgba(16, 18, 27, 0.4);
            }
            h1 { font-size: 1.6rem; letter-spacing: 1px; line-height: 1.2; }
            .subtitle { font-size: 0.7rem; }
            .container { padding: 15px 15px; }
            .search-box { padding: 12px 20px; font-size: 1rem; }
            .song-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .song-card { padding: 12px; }
            .song-title { font-size: 0.95rem; }
            #star-canvas { opacity: 0.8; }
        }
    </style>
</head>

    // ================= 交互逻辑 =================
    const songContainer = document.getElementById('songContainer');
    const searchInput = document.getElementById('searchInput');
    const tabs = document.querySelectorAll('.tab-btn');
    const statsBar = document.getElementById('statsBar');

    let allSongs = [];
    Object.keys(musicData).forEach(category => {
        Object.keys(musicData[category]).forEach(artist => {
            musicData[category][artist].forEach(song => {
                allSongs.push({title: song, artist: artist, category: category});
            });
        });
    });

    statsBar.innerText = `DATABASE LOADED: ${allSongs.length} RECORDS FOUND`;

    function renderSongs(songs) {
        songContainer.innerHTML = '';
        if (songs.length === 0) {
            songContainer.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: #888; padding: 40px; border-radius: 12px;">NO DATA FOUND</div>`;
            return;
        }
        
        const displaySongs = songs.slice(0, 300);
        displaySongs.forEach(s => {
            const card = document.createElement('div');
            card.className = 'song-card';
            card.innerHTML = `
                <div class="song-title">${s.title}</div>
                <div class="song-artist">
                    <span>${s.artist}</span>
                    <span class="tag">${s.category}</span>
                </div>
            `;
            card.addEventListener('click', (e) => {
                const rect = card.getBoundingClientRect();
                createStar(rect.left + rect.width / 2, rect.top + rect.height / 2);
            });
            songContainer.appendChild(card);
        });
    }

    renderSongs(allSongs);

    searchInput.addEventListener('input', (e) => {
        const keyword = e.target.value.toLowerCase().trim();
        renderSongs(allSongs.filter(s => s.title.toLowerCase().includes(keyword) || s.artist.toLowerCase().includes(keyword)));
    });

    tabs.forEach(btn => {
        btn.addEventListener('click', () => {
            tabs.forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
            const cat = btn.dataset.cat;
            if (cat === 'all') renderSongs(allSongs);
            else renderSongs(allSongs.filter(s => s.category === cat));
            searchInput.value = '';
        });
    });

    function createStar(x, y) {
        const star = document.createElement('div');
        star.className = 'click-star';
        star.style.left = (x - 20) + 'px';
        star.style.top = (y - 20) + 'px';
        const rotation = Math.random() * 360;
        star.style.transform = `rotate(${rotation}deg)`;
        document.body.appendChild(star);
        setTimeout(() => star.remove(), 600);
    }

    // ================= 3. 动态星空 (Deep Space Mode) =================
    const canvas = document.getElementById('star-canvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    let stars = [];

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    class Star {
        constructor() {
            this.reset(true);
        }

        reset(initial = false) {
            this.x = (Math.random() - 0.5) * width;
            this.y = (Math.random() - 0.5) * height;
            // 深度 Z，范围 0 (近) 到 1000 (远)
            this.z = initial ? Math.random() * 1000 : 1000; 
            // 随机速度：0.2 到 1.5，极慢速漂浮
            this.speed = Math.random() * 1.3 + 0.2; 
            // 随机闪烁相位
            this.blinkOffset = Math.random() * 100;
        }

        update() {
            this.z -= this.speed; 
            if (this.z < 1) {
                this.reset();
            }
        }

        draw(frame) {
            // 透视投影
            const sx = (this.x / this.z) * 500 + width / 2;
            const sy = (this.y / this.z) * 500 + height / 2;

            // 如果在屏幕外则不画
            if (sx < 0 || sx > width || sy < 0 || sy > height) return;

            // 星星大小随距离变化，最大 2.5px
            const size = (1 - this.z / 1000) * 2.5;
            
            // 基础透明度随距离变化
            let opacity = (1 - this.z / 1000);
            
            // 呼吸闪烁效果：使用正弦波
            // 只有远处的星星闪烁明显，近处常亮
            if (this.z > 500) {
                const blink = (Math.sin(frame * 0.05 + this.blinkOffset) + 1) / 2; // 0~1
                opacity = opacity * (0.5 + blink * 0.5); // 0.5倍亮度保底
            }

            ctx.beginPath();
            ctx.fillStyle = `rgba(255, 255, 255, ${opacity})`;
            ctx.arc(sx, sy, size, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    function initStars() {
        stars = [];
        for (let i = 0; i < 800; i++) { // 增加星星数量至800
            stars.push(new Star());
        }
    }
    initStars();

    let frame = 0;
    function animate() {
        // 清除画布，不再使用半透明遮罩(取消拖尾)
        ctx.clearRect(0, 0, width, height);
        
        frame++;
        stars.forEach(star => {
            star.update();
            star.draw(frame);
        });
        requestAnimationFrame(animate);
    }
    animate();
